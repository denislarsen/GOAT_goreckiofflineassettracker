# GOAT on the Synology NAS — pulls the prebuilt image from GitHub Container
# Registry and keeps itself up to date via Watchtower. See DEPLOY.md for the
# one-time setup walkthrough.
services:
  goat:
    image: ghcr.io/denislarsen/goat:latest
    container_name: goat
    ports:
      - "8420:8420"
    volumes:
      # All data lives here on the NAS — survives every update.
      - /volume1/docker/goat/data:/data
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: goat-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # If you keep the ghcr.io package PRIVATE, uncomment this line after
      # running `docker login ghcr.io` on the NAS (see DEPLOY.md appendix):
      # - /volume1/docker/goat/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_CLEANUP=true          # remove superseded images
      - WATCHTOWER_POLL_INTERVAL=3600    # check for a new version every hour
      - WATCHTOWER_LABEL_ENABLE=true     # only touch containers labelled above
    restart: unless-stopped
